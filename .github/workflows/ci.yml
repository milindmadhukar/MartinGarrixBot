name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # go.mod is the single source of truth for the Go version, matching the
      # Dockerfile's golang:1.25-alpine. check-latest picks up the newest patch
      # release rather than whatever the runner has cached.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race because RadioManager is shared between gateway listeners and
      # command handlers; -shuffle to catch order-dependent tests.
      - name: Test
        run: go test -race -shuffle=on ./...

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: garrixbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # The suite runs the real migrations from db/migrations against this
      # database, so the queries are exercised against the schema that ships.
      - name: Test
        env:
          MGBOT_TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/garrixbot_test?sslmode=disable
        run: go test -tags integration -count=1 ./db/...
