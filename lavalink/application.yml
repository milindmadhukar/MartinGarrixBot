server: # REST and WS server
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false # Whether to enable HTTP/2 support
plugins:
  youtube:
    enabled: true # Whether this source can be used.
    allowSearch: true # Whether "ytsearch:" and "ytmsearch:" can be used.
    allowDirectVideoIds: true # Whether just video IDs can match. If false, only complete URLs will be loaded.
    allowDirectPlaylistIds: true # Whether just playlist IDs can match. If false, only complete URLs will be loaded.
    # The clients to use for track loading. See below for a list of valid clients.
    # Clients are queried in the order they are given (so the first client is queried first and so on...)
    #
    # TV is the only OAuth-capable client (Tv.java is the sole supportsOAuth() override),
    # and on hosts whose IP YouTube distrusts (datacenter/VPS ranges) it is the only one
    # that gets past "This video requires login". Note it is playback-only:
    # Tv.canHandleRequest() is hardcoded false, so it never participates in search or
    # resolution - those always fall to MUSIC/ANDROID_VR/WEB regardless of ordering.
    clients:
      - TV               # authenticated playback; beats "This video requires login"
      - TVHTML5_SIMPLY   # unauthenticated fallback, Opus, playback-capable
      - ANDROID_VR       # Opus, no auth
      - MUSIC            # search only (ytmsearch:), no playback
      - WEB
      - WEBEMBEDDED

    # Authenticates requests as a real account, which is what gets past
    # "This video requires login" on datacenter IPs.
    # The refresh token is a credential and must NOT be committed here: it is
    # injected via the PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN environment variable.
    # Without it, Lavalink prints a google.com/device code on startup to re-authorise.
    # !!! Authorise with a BURNER Google account - YouTube bans accounts for this. !!!
    oauth:
      enabled: true

    # YouTube's player scripts change constantly and youtube-source's built-in
    # cipher extraction keeps breaking ("Must find sig function from script: ...").
    # Upstream delegates this to a remote cipher server instead. This is the public
    # instance (no password, ratelimited to 10 req/s); self-host kikkia/yt-cipher
    # and repoint this if that ever becomes a constraint.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "stmpdbot"

lavalink:
  plugins:
    # Pinned to a snapshot because two fixes we need are in no tagged release yet
    # (1.18.2, 2026-07-27, is still latest). Revisit when 1.18.3 ships.
    #
    # b33460b3 - PlayStation 4 User-Agent for the TV client. 1.18.2 sends a Cobalt UA on
    #   the TVHTML5 player endpoint, which YouTube began rejecting on 2026-08-18:
    #   "The page needs to be reloaded.", 0 formats, so every track resolved and then
    #   died at playback. https://github.com/lavalink-devs/youtube-source/issues/226
    # f45bbb7a - recovers the total length for formats that omit contentLength. Without
    #   it roughly one track in three threw at the end ("Something went wrong when
    #   decoding the track", seek past EOF in MpegStandardFileTrackProvider) and was cut
    #   up to a minute short. https://github.com/lavalink-devs/youtube-source/issues/234
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true # Set to true if you want to use a snapshot version.
#    - dependency: "com.github.example:example-plugin:1.0.0" # required, the coordinates of your plugin
#      repository: "https://maven.example.com/releases" # optional, defaults to the Lavalink releases repository by default
#      snapshot: false # optional, defaults to false, used to tell Lavalink to use the snapshot repository instead of the release repository
#  pluginsDir: "./plugins" # optional, defaults to "./plugins"
#  defaultPluginRepository: "https://maven.lavalink.dev/releases" # optional, defaults to the Lavalink release repository
#  defaultPluginSnapshotRepository: "https://maven.lavalink.dev/snapshots" # optional, defaults to the Lavalink snapshot repository
  server:
    password: "youshallnotpass"
    sources:
      # The default Youtube source is now deprecated and won't receive further updates. Please use https://github.com/lavalink-devs/youtube-source#plugin instead.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true # warning: keeping HTTP enabled without a proxy configured could expose your server's IP address.
      local: false
    filters: # All filters are enabled by default
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false # Setting to true reduces the number of allocations made by each player at the expense of frame rebuilding (e.g. non-instantaneous volume changes)
    bufferDurationMs: 400 # The duration of the NAS buffer. Higher values fare better against longer GC pauses. Duration <= 0 to disable JDA-NAS. Minimum of 40ms, lower values may introduce pauses.
    frameBufferDurationMs: 5000 # How many milliseconds of audio to keep buffered
    opusEncodingQuality: 10 # Opus encoder quality. Valid values range from 0 to 10, where 10 is best quality but is the most expensive on the CPU.
    resamplingQuality: LOW # Quality of resampling operations. Valid values are LOW, MEDIUM and HIGH, where HIGH uses the most CPU.
    trackStuckThresholdMs: 10000 # The threshold for how long a track can be stuck. A track is stuck if does not return any audio data.
    useSeekGhosting: true # Seek ghosting is the effect where whilst a seek is in progress, the audio buffer is read from until empty, or until seek is ready.
    youtubePlaylistLoadLimit: 6 # Number of pages at 100 each
    playerUpdateInterval: 5 # How frequently to send player updates to clients, in seconds
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    #ratelimit:
      #ipBlocks: ["1.0.0.0/8", "..."] # list of ip blocks
      #excludedIps: ["...", "..."] # ips which should be explicit excluded from usage by lavalink
      #strategy: "RotateOnBan" # RotateOnBan | LoadBalance | NanoSwitch | RotatingNanoSwitch
      #searchTriggersFail: true # Whether a search 429 should trigger marking the ip as failing
      #retryLimit: -1 # -1 = use default lavaplayer value | 0 = infinity | >0 = retry will happen this numbers times
    #youtubeConfig: # Required for avoiding all age restrictions by YouTube, some restricted videos still can be played without.
      #email: "" # Email of Google account
      #password: "" # Password of Google account
    #httpConfig: # Useful for blocking bad-actors from ip-grabbing your music node and attacking it, this way only the http proxy will be attacked
      #proxyHost: "localhost" # Hostname of the proxy, (ip or domain)
      #proxyPort: 3128 # Proxy port, 3128 is the default for squidProxy
      #proxyUser: "" # Optional user for basic authentication fields, leave blank if you don't use basic auth
      #proxyPassword: "" # Password for basic authentication
    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""
#  tags:
#    some_key: some_value
#    another_key: another_value

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    # Surfaces client selection, per-client failures and OAuth token refreshes. Without
    # this the only record of a YouTube breakage is the exception text the bot receives.
    dev.lavalink.youtube: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
    beforeRequest: false

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
