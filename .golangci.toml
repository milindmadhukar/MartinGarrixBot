version = "2"

[linters]
default = "none"
enable = [
    "govet",
    "ineffassign",
    "staticcheck",
    "sloglint",
    "whitespace",
    "errname",
    "errorlint",
    "importas"
]

# gofmt is deliberately not enabled here. golangci-lint would apply it to the
# whole repo, and formatting files that a change does not otherwise touch is
# churn. The CI workflow runs gofmt against changed files only.
